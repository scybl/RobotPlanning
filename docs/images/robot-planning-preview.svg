<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RobotPlanning robotics validation showcase</title>
  <desc id="desc">A polished README preview showing kinematics, planning, dynamics validation, and ROS-free numerical results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.46" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="56" y="50" width="1088" height="575" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="56" y="50" width="1088" height="122" rx="28" fill="#111827"/>
  <rect x="56" y="136" width="1088" height="36" fill="#111827"/>
  <text x="96" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">RobotPlanning</text>
  <text x="96" y="141" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="18">Kinematics, checkpoint planning, inverse kinematics, and IIWA dynamics validation</text>
  <rect x="888" y="82" width="208" height="44" rx="22" fill="#34d399"/>
  <text x="929" y="110" fill="#064e3b" font-family="Arial, sans-serif" font-size="15" font-weight="700">ROS-free Quick Run</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <text x="122" y="250" fill="#64748b" font-size="15">YouBot Jacobian</text>
    <text x="122" y="287" fill="#1d4ed8" font-size="32" font-weight="700">(6,5) / 5</text>
    <text x="122" y="313" fill="#475569" font-size="14">shape and rank</text>

    <rect x="350" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#dcfce7"/>
    <text x="376" y="250" fill="#64748b" font-size="15">Checkpoint path</text>
    <text x="376" y="287" fill="#047857" font-size="34" font-weight="700">0.7969 m</text>
    <text x="376" y="313" fill="#475569" font-size="14">order [1, 2, 0, 3]</text>

    <rect x="604" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#fef3c7"/>
    <text x="630" y="250" fill="#64748b" font-size="15">IIWA dynamics</text>
    <text x="630" y="287" fill="#92400e" font-size="32" font-weight="700">0.00e+00</text>
    <text x="630" y="313" fill="#475569" font-size="14">inertia symmetry error</text>

    <rect x="858" y="210" width="238" height="116" rx="18" fill="#ffffff" stroke="#fce7f3"/>
    <text x="884" y="250" fill="#64748b" font-size="15">Runtime paths</text>
    <text x="884" y="287" fill="#be185d" font-size="30" font-weight="700">3 modes</text>
    <text x="884" y="313" fill="#475569" font-size="14">quick, Docker, ROS build</text>
  </g>

  <g transform="translate(98 380)">
    <rect width="450" height="178" rx="22" fill="#0b1220"/>
    <circle cx="34" cy="36" r="8" fill="#38bdf8"/>
    <line x1="34" y1="36" x2="98" y2="84" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="98" cy="84" r="16" fill="#ffffff" stroke="#38bdf8" stroke-width="6"/>
    <line x1="98" y1="84" x2="168" y2="66" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="168" cy="66" r="16" fill="#ffffff" stroke="#38bdf8" stroke-width="6"/>
    <line x1="168" y1="66" x2="238" y2="106" stroke="#34d399" stroke-width="12" stroke-linecap="round"/>
    <circle cx="238" cy="106" r="16" fill="#ffffff" stroke="#34d399" stroke-width="6"/>
    <text x="290" y="54" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Numerical demo</text>
    <text x="290" y="90" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="14">EE xyz [-.0378,.0330,.4490]</text>
    <text x="290" y="122" fill="#94a3b8" font-family="Menlo, Consolas, monospace" font-size="14">gravity norm 3.0920</text>
  </g>

  <g transform="translate(604 370)">
    <rect width="492" height="198" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="30" y="46" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Robotics Stack Coverage</text>
    <line x1="30" y1="70" x2="462" y2="70" stroke="#e2e8f0"/>
    <text x="30" y="110" fill="#475569" font-family="Arial, sans-serif" font-size="15">01  Quaternion conversion and YouBot forward kinematics</text>
    <text x="30" y="146" fill="#475569" font-family="Arial, sans-serif" font-size="15">02  Checkpoint ordering, SE(3) interpolation, and IK trajectory</text>
    <text x="30" y="182" fill="#475569" font-family="Arial, sans-serif" font-size="15">03  KUKA IIWA14 dynamics validation with Docker reproducibility</text>
  </g>
</svg>
