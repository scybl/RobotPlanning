<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">RobotPlanning workflow preview</title>
  <desc id="desc">A robotics planning workflow showing kinematics, planning, and dynamics validation.</desc>
  <rect width="1000" height="560" fill="#f7f8fb"/>
  <rect x="46" y="40" width="908" height="480" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="82" y="92" fill="#182230" font-family="Arial, sans-serif" font-size="34" font-weight="700">RobotPlanning</text>
  <text x="82" y="124" fill="#647184" font-family="Arial, sans-serif" font-size="17">Kinematics, checkpoint planning, inverse kinematics, and IIWA dynamics</text>

  <g transform="translate(82 170)">
    <rect width="246" height="110" rx="12" fill="#e9f5ff" stroke="#9cccf2"/>
    <text x="24" y="42" fill="#12324a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Kinematics</text>
    <text x="24" y="72" fill="#40566d" font-family="Arial, sans-serif" font-size="14">Quaternion, DH FK, Jacobian</text>
  </g>
  <g transform="translate(377 170)">
    <rect width="246" height="110" rx="12" fill="#f1f8ec" stroke="#a8d18d"/>
    <text x="24" y="42" fill="#17351c" font-family="Arial, sans-serif" font-size="19" font-weight="700">Planning</text>
    <text x="24" y="72" fill="#405d3a" font-family="Arial, sans-serif" font-size="14">Checkpoint order and SE(3) path</text>
  </g>
  <g transform="translate(672 170)">
    <rect width="210" height="110" rx="12" fill="#fff4df" stroke="#e3bb68"/>
    <text x="24" y="42" fill="#46310f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Dynamics</text>
    <text x="24" y="72" fill="#6b531f" font-family="Arial, sans-serif" font-size="14">Inertia, gravity, qdd checks</text>
  </g>
  <path d="M328 225 H377" stroke="#7c8797" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M623 225 H672" stroke="#7c8797" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c8797"/>
    </marker>
  </defs>

  <g transform="translate(128 335)">
    <line x1="0" y1="100" x2="60" y2="62" stroke="#1f6feb" stroke-width="12" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="124" y2="42" stroke="#1f6feb" stroke-width="12" stroke-linecap="round"/>
    <line x1="124" y1="42" x2="190" y2="74" stroke="#1f6feb" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="100" r="17" fill="#ffffff" stroke="#1f6feb" stroke-width="6"/>
    <circle cx="60" cy="62" r="17" fill="#ffffff" stroke="#1f6feb" stroke-width="6"/>
    <circle cx="124" cy="42" r="17" fill="#ffffff" stroke="#1f6feb" stroke-width="6"/>
    <circle cx="190" cy="74" r="17" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
  </g>
  <g transform="translate(420 332)">
    <rect width="390" height="126" rx="12" fill="#101820"/>
    <text x="24" y="38" fill="#8ee4af" font-family="Menlo, Consolas, monospace" font-size="14">Jacobian shape/rank  (6, 5) / 5</text>
    <text x="24" y="68" fill="#7dd3fc" font-family="Menlo, Consolas, monospace" font-size="14">Shortest order       [1, 2, 0, 3]</text>
    <text x="24" y="98" fill="#f4d35e" font-family="Menlo, Consolas, monospace" font-size="14">Min inertia eig      0.0010</text>
  </g>
</svg>
