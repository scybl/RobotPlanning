<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RobotPlanning ROS stack workflow</title>
  <desc id="desc">A visual summary of the ROS build, RViz demos, Gazebo demos, and Docker validation path.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#f5f3ff"/>
  <rect x="56" y="50" width="1088" height="460" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="90" y="106" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">ROS 2 Planning Stack</text>
  <text x="90" y="138" fill="#475569" font-family="Arial, sans-serif" font-size="16">One workspace for YouBot kinematics, checkpoint motion planning, IIWA dynamics, RViz/Gazebo, and Docker validation.</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="202" width="190" height="138" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="242" fill="#5b21b6" font-size="17" font-weight="700">1. Build</text>
    <text x="120" y="276" fill="#334155" font-size="14">colcon workspace</text>
    <text x="120" y="302" fill="#334155" font-size="14">12 ROS packages</text>

    <path d="M300 270 H360" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M348 256 L364 270 L348 284" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="380" y="202" width="190" height="138" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="410" y="242" fill="#1e3a8a" font-size="17" font-weight="700">2. RViz</text>
    <text x="410" y="276" fill="#334155" font-size="14">YouBot FK</text>
    <text x="410" y="302" fill="#334155" font-size="14">trail visualisation</text>

    <path d="M590 270 H650" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M638 256 L654 270 L638 284" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="670" y="202" width="190" height="138" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="242" fill="#166534" font-size="17" font-weight="700">3. Planning</text>
    <text x="700" y="276" fill="#334155" font-size="14">checkpoint order</text>
    <text x="700" y="302" fill="#334155" font-size="14">SE(3) interpolation</text>

    <path d="M880 270 H940" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M928 256 L944 270 L928 284" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="960" y="202" width="150" height="138" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="990" y="242" fill="#92400e" font-size="17" font-weight="700">4. Validate</text>
    <text x="990" y="276" fill="#334155" font-size="14">IIWA dynamics</text>
    <text x="990" y="302" fill="#334155" font-size="14">Docker run</text>
  </g>

  <rect x="90" y="392" width="1018" height="60" rx="14" fill="#0b1220"/>
  <text x="118" y="429" fill="#c4b5fd" font-family="Menlo, Consolas, monospace" font-size="15">quick -> ros-build -> youbot-fk / youbot-planning / iiwa-validation -> docker</text>
</svg>
